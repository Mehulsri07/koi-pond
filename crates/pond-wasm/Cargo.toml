[package]
name = "pond-wasm"
version = "0.1.0"
edition = "2024"
publish = false
description = "A thin wasm-bindgen wrapper that lets the git-koi koi swim in a browser."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
git-koi = { git = "https://github.com/Mehulsri07/git-koi", rev = "f41b6ca3b7dd8d7948a29e10708c298bda7ff6e0" }
serde_json = "1"
wasm-bindgen = "0.2"
