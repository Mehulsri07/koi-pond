[package]
name = "pond-wasm"
version = "0.1.0"
edition = "2024"
publish = false
description = "A thin wasm-bindgen wrapper that lets the git-koi koi swim in a browser."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
git-koi = { git = "https://github.com/Mehulsri07/git-koi", rev = "35a0eb4265bec3a864ba0efc1918252e89bba60b" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasm-bindgen = "0.2"
