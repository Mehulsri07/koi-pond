<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pond sprite sheet</title>
<!--
  Every sprite in web/art/ at 4× on day water and on night water, a few pads dressed
  with flowers and droplets as the pond will show them, and the palette.
  Serve the repository root (for example `python3 -m http.server` there) and open
  /art/sheet.html; run `node scripts/art.mjs` first so the PNGs are current.
-->
<style>
  :root {
    --day: #1f4a47;
    --night: #0a171b;
    --ink: #e9f2ef;
    --ink-dim: #9fb8b2;
    --page: #13201f;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 16px;
    background: var(--page);
    color: var(--ink);
    font: 13px/1.4 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  h1 { font-size: 16px; margin: 0 0 4px; }
  h2 { font-size: 13px; margin: 0 0 8px; color: var(--ink-dim); font-weight: normal; text-transform: uppercase; letter-spacing: 0.08em; }
  .layout { display: flex; gap: 16px; align-items: flex-start; flex-wrap: wrap; }
  .waters { flex: 1 1 100%; display: flex; flex-direction: column; gap: 16px; min-width: 0; }
  .water { border-radius: 6px; padding: 12px; }
  .water.day { background: var(--day); }
  .water.night { background: var(--night); }
  .row { display: flex; flex-wrap: wrap; gap: 12px 16px; align-items: flex-end; margin-bottom: 12px; }
  figure { margin: 0; display: flex; flex-direction: column; align-items: center; gap: 4px; }
  figcaption { color: var(--ink-dim); font-size: 11px; }
  canvas { image-rendering: pixelated; display: block; }
  .palette { flex: 0 1 560px; columns: 2; background: #0f1a1a; border-radius: 6px; padding: 12px; }
  .swatch { display: flex; align-items: center; gap: 8px; margin: 2px 0; }
  .chip { width: 28px; height: 18px; border-radius: 2px; flex: none; }
  .key { width: 14px; text-align: center; color: var(--ink); }
  .hex { color: var(--ink-dim); }
  .error { color: #f5a; }
</style>
</head>
<body>
<h1>Pond sprites</h1>
<p class="hex">4× native. Pads are lit from the top left; each size shows all eight notch directions, five drawn and three drawn transposed (x and y swapped).</p>
<div class="layout">
  <div class="waters">
    <section class="water day"><h2>Day water</h2><div class="sprites"></div><h2>On the pond</h2><div class="combos row"></div></section>
    <section class="water night"><h2>Night water</h2><div class="sprites"></div><h2>On the pond</h2><div class="combos row"></div></section>
  </div>
  <aside class="palette"><h2>Palette</h2><div id="swatches"></div></aside>
</div>
<script type="module">
const SCALE = 4;
const PAD_SIZES = [16, 24, 32, 40, 48];
const COMPASS = ['e', 'se', 's', 'sw', 'w', 'nw', 'n', 'ne'];
const GROUPS = [
  ['lotus-pink-s', 'lotus-white-s', 'lotus-purple-s', 'lotus-pink-l', 'lotus-white-l', 'lotus-purple-l', 'bud'],
  ['bud-ring', 'droplet', 'food', 'firefly-0', 'firefly-1', 'moon-reflection'],
];
// Pads dressed as the pond will show them: [pad, transposed, [sprite, dx, dy] ...],
// offsets from the pad's anchor to the dressing's anchor, in native pixels. A bud stands
// in the water beside its pad, on its ring.
const COMBOS = [
  ['pad-16-ne', false, []],
  ['pad-24-w', false, [['lotus-pink-s', 2, 1]]],
  ['pad-32-ne', true, [['lotus-white-s', -1, 0]]],
  ['pad-40-nw', false, [['lotus-purple-l', 2, 3], ['droplet', -6, 10], ['droplet', 9, -9]]],
  ['pad-48-se', false, [['lotus-pink-l', -3, 0], ['droplet', -12, 10], ['droplet', 4, -15]]],
  ['pad-48-e', true, [['lotus-white-l', 3, -3], ['droplet', -13, 6], ['bud-ring', -28, 0], ['bud', -28, 0]]],
];

function load(name) {
  return new Promise((resolve, reject) => {
    const image = new Image();
    image.onload = () => resolve(image);
    image.onerror = () => reject(new Error(`could not load ${name}.png`));
    image.src = `../web/art/${name}.png`;
  });
}

function figure(canvas, label) {
  const element = document.createElement('figure');
  const caption = document.createElement('figcaption');
  caption.textContent = label;
  element.append(canvas, caption);
  return element;
}

function spriteCanvas(image) {
  const canvas = document.createElement('canvas');
  canvas.width = image.width * SCALE;
  canvas.height = image.height * SCALE;
  const ctx = canvas.getContext('2d');
  ctx.imageSmoothingEnabled = false;
  ctx.drawImage(image, 0, 0, canvas.width, canvas.height);
  return canvas;
}

// One pad as the pond shows it for a notch direction: drawn, or drawn transposed.
function padFor(size, direction, sprites) {
  for (const [name, sprite] of Object.entries(sprites)) {
    if (!name.startsWith(`pad-${size}-`)) continue;
    if (sprite.notch === direction) return { name, transposed: false };
    if (sprite.transposedNotch === direction) return { name, transposed: true };
  }
  return null;
}

function drawPad(ctx, image, x, y, transposed) {
  ctx.save();
  ctx.translate(x, y);
  if (transposed) ctx.transform(0, 1, 1, 0, 0, 0);
  ctx.drawImage(image, 0, 0);
  ctx.restore();
}

function padCanvas(image, transposed) {
  const canvas = document.createElement('canvas');
  canvas.width = image.width * SCALE;
  canvas.height = image.height * SCALE;
  const ctx = canvas.getContext('2d');
  ctx.imageSmoothingEnabled = false;
  ctx.scale(SCALE, SCALE);
  drawPad(ctx, image, 0, 0, transposed);
  return canvas;
}

function comboCanvas([padName, transposed, dressing], images, sprites) {
  const pad = sprites[padName];
  const margin = 12;
  const width = pad.width + margin * 2;
  const height = pad.height + margin * 2;
  const canvas = document.createElement('canvas');
  canvas.width = width * SCALE;
  canvas.height = height * SCALE;
  const ctx = canvas.getContext('2d');
  ctx.imageSmoothingEnabled = false;
  ctx.scale(SCALE, SCALE);
  const cx = margin + pad.anchor[0];
  const cy = margin + pad.anchor[1];
  drawPad(ctx, images[padName], margin, margin, transposed);
  for (const [name, dx, dy] of dressing) {
    const sprite = sprites[name];
    ctx.drawImage(images[name], cx + dx - sprite.anchor[0], cy + dy - sprite.anchor[1]);
  }
  return canvas;
}

async function main() {
  const [sprites, palette] = await Promise.all([
    fetch('../web/art/sprites.json').then((response) => response.json()),
    fetch('palette.json').then((response) => response.json()),
  ]);
  const names = Object.keys(sprites);
  const images = Object.fromEntries(await Promise.all(names.map(async (name) => [name, await load(name)])));
  for (const water of document.querySelectorAll('.water')) {
    const holder = water.querySelector('.sprites');
    for (const size of PAD_SIZES) {
      const row = document.createElement('div');
      row.className = 'row';
      for (const direction of COMPASS) {
        const pad = padFor(size, direction, sprites);
        if (!pad) continue;
        const label = pad.transposed ? `${direction}: ${pad.name} transposed` : `${direction}: ${pad.name}`;
        row.append(figure(padCanvas(images[pad.name], pad.transposed), label));
      }
      holder.append(row);
    }
    for (const group of GROUPS) {
      const row = document.createElement('div');
      row.className = 'row';
      for (const name of group) {
        const { width, height } = sprites[name];
        row.append(figure(spriteCanvas(images[name]), `${name} ${width}×${height}`));
      }
      holder.append(row);
    }
    const combos = water.querySelector('.combos');
    for (const combo of COMBOS) {
      combos.append(figure(comboCanvas(combo, images, sprites), [combo[1] ? `${combo[0]} transposed` : combo[0], ...combo[2].map(([name]) => name)].join(' + ')));
    }
  }
  const swatches = document.getElementById('swatches');
  for (const [key, { name, color }] of Object.entries(palette.legend)) {
    const row = document.createElement('div');
    row.className = 'swatch';
    row.innerHTML = `<span class="chip" style="background:${color}"></span><span class="key">${key}</span><span>${name}</span><span class="hex">${color}</span>`;
    swatches.append(row);
  }
  document.body.dataset.ready = 'true';
}

main().catch((error) => {
  const message = document.createElement('p');
  message.className = 'error';
  message.textContent = error.message;
  document.body.prepend(message);
  document.body.dataset.ready = 'error';
});
</script>
</body>
</html>
