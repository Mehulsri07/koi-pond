# Nightly: collect Mehulsri07's GitHub snapshot, commit it, build the pond, deploy to Pages.
# One workflow, because a commit pushed with the workflow token does not trigger other
# workflows. The default branch is never named: a schedule event carries no
# github.event.repository, so collect asks the API and passes the branch and the exact
# commit down as job outputs.
#
# Job graph:  collect -> commit -> build -> deploy   (schedule, manual)
#                        build -> deploy             (push to the default branch)
name: pond

on:
  schedule:
    - cron: "20 0 * * *"
  workflow_dispatch:
  # Expressions are not allowed in the trigger, so every push starts a run; a push to any
  # other branch or a tag skips every job below.
  push:

permissions: {}

env:
  CARGO_TERM_COLOR: always

jobs:
  # Compiles and runs third-party code, so it only reads: no push credentials, and the
  # snapshot leaves as an artifact.
  collect:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      branch: ${{ steps.branch.outputs.branch }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - name: Resolve the default branch
        id: branch
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
        run: scripts/resolve-branch.sh
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch
        id: rust
        with:
          toolchain: stable
      - name: Cache cargo
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry
            ~/.cargo/git
          key: collect-${{ runner.os }}-${{ steps.rust.outputs.cachekey }}-${{ hashFiles('crates/pond-wasm/Cargo.toml') }}
          restore-keys: |
            collect-${{ runner.os }}-${{ steps.rust.outputs.cachekey }}-
      - name: Install git-koi at the pinned rev
        run: |
          rev=$(sed -n 's/^git-koi = .*rev = "\([0-9a-f]\{40\}\)".*/\1/p' crates/pond-wasm/Cargo.toml)
          test -n "$rev" || { echo "::error::could not read the git-koi rev from crates/pond-wasm/Cargo.toml"; exit 1; }
          echo "git-koi rev: $rev"
          cargo install --git https://github.com/Mehulsri07/git-koi --rev "$rev" --locked git-koi
      - name: Collect the snapshot
        env:
          GH_TOKEN: ${{ github.token }}
        run: git-koi collect Mehulsri07 --output "$RUNNER_TEMP/snapshot.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: snapshot
          path: ${{ runner.temp }}/snapshot.json
          if-no-files-found: error
          retention-days: 1

  # The only job that can push. It runs no third-party code beyond actions.
  commit:
    needs: collect
    if: ${{ !cancelled() && needs.collect.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: pond-commit
      cancel-in-progress: false
    outputs:
      branch: ${{ steps.commit.outputs.branch }}
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ needs.collect.outputs.branch }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: snapshot
          path: ${{ runner.temp }}/snapshot
      - name: Commit the snapshot if it changed
        id: commit
        env:
          BRANCH: ${{ needs.collect.outputs.branch }}
          SNAPSHOT: ${{ runner.temp }}/snapshot/snapshot.json
        run: scripts/commit-snapshot.sh

  build:
    needs: [collect, commit]
    # After a commit job that succeeded (schedule, manual), or on a push to the default
    # branch, where collect and commit are skipped. Never after a failed collect or commit,
    # so a failed collect fails the run and deploys nothing. A push to another branch or a
    # tag skips everything.
    if: >-
      ${{ !cancelled()
      && (needs.commit.result == 'success'
      || (needs.collect.result == 'skipped'
      && github.event_name == 'push'
      && github.ref == format('refs/heads/{0}', github.event.repository.default_branch))) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # The exact commit the commit job left on the branch (so the snapshot is included),
      # or the pushed commit on a push run, where commit is skipped and its output is empty.
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ needs.commit.outputs.sha || github.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch
        id: rust
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Cache cargo
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: build-${{ runner.os }}-${{ steps.rust.outputs.cachekey }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            build-${{ runner.os }}-${{ steps.rust.outputs.cachekey }}-
      - name: Install wasm-bindgen-cli at the lockfile's version
        run: |
          version=$(scripts/build.sh --wasm-bindgen-version)
          if [ "$(wasm-bindgen --version 2>/dev/null | awk '{ print $2 }')" != "$version" ]; then
            cargo install wasm-bindgen-cli --version "$version" --locked
          fi
      - name: Build the site into dist/
        run: scripts/build.sh
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: dist

  deploy:
    needs: build
    # needs.build alone is not enough: with collect skipped (a push run) the implicit
    # success() is false for a grandchild job, so say what we mean.
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pond
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # actions/deploy-pages fails with a cryptic error when Pages is off, so say what to
      # do first. A failed check only annotates; the deploy step below is what decides.
      - name: Check that GitHub Pages is enabled for Actions
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          build_type=$(gh api "repos/$REPO/pages" --jq .build_type 2>/dev/null || true)
          if [ "$build_type" != "workflow" ]; then
            echo "::error title=GitHub Pages is not set to GitHub Actions::Enable GitHub Pages: Settings → Pages → Source: GitHub Actions, then re-run this workflow. The deploy step below will fail until then."
          fi
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
